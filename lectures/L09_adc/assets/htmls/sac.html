<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SAR ADC: one comparison for each bit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* EE5203 L09 in-lecture demo. Same words, colours and example as the slide
       "A SAR ADC finds one bit per step": input 2.40 V, 4 bits, result 1011. */
    :root {
      --ink: #174f73; --mid: #2b789f; --or: #d47b28; --ort: #b8621a;
      --gr: #3f7f58; --grt: #2b5a3e; --red: #a32d2d; --mu: #5a6b76;
      --grid: #c8d8e2; --txt: #355262; --fb: #e8f2f7; --fg: #edf6f0;
      --kept: #d3e6f0; --bg: #f8fafc;
      --mono: ui-monospace, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 14px 28px 16px;
      font-family: Quicksand, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 18px; color: var(--txt); background: var(--bg);
    }
    .wrap { max-width: 1500px; margin: 0 auto; }
    h1 { margin: 0; font-size: 32px; font-weight: 700; color: var(--ink); }
    .lead { margin: 2px 0 10px; font-size: 19px; }

    .controls {
      display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px;
      padding: 9px 18px; margin-bottom: 12px;
      background: #ffffff; border: 2px solid var(--grid); border-radius: 14px;
    }
    .ctl { display: flex; align-items: center; gap: 10px; }
    .ctl > span.name { font-weight: 700; color: var(--ink); }
    #vinSlider { width: 300px; accent-color: var(--ink); }
    #vinValue { font-family: var(--mono); font-weight: 700; font-size: 22px; color: var(--ink); min-width: 5.2em; }
    button {
      font: inherit; font-weight: 700; cursor: pointer;
      padding: 7px 16px; border-radius: 999px;
      border: 2px solid var(--grid); background: #ffffff; color: var(--ink);
    }
    button:hover { border-color: var(--mid); }
    button.primary { background: var(--ink); border-color: var(--ink); color: #ffffff; }
    button.on { background: var(--fb); border-color: var(--mid); }
    button:disabled { opacity: 0.45; cursor: default; }
    .keys { margin-left: auto; font-size: 15px; color: var(--mu); }
    kbd {
      font-family: var(--mono); font-size: 14px; padding: 1px 6px;
      border: 1px solid var(--grid); border-radius: 6px; background: #ffffff;
    }

    .main { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; }
    .card { background: #ffffff; border: 2px solid var(--grid); border-radius: 14px; padding: 12px 16px; }
    .card h2 {
      margin: 0 0 4px; font-size: 16px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: var(--mid);
    }
    svg { display: block; width: 100%; height: auto; }
    #zoom { max-height: 270px; }
    svg text { font-family: Quicksand, system-ui, sans-serif; }
    svg text.m { font-family: var(--mono); }

    #stepTitle { font-size: 24px; font-weight: 700; color: var(--ink); margin: 2px 0 0; }
    #stepText { margin: 4px 0 0; font-size: 19px; line-height: 1.3; min-height: 3.9em; }
    #stepText b.hi { color: var(--grt); } #stepText b.lo { color: var(--red); }
    #stepText .v { font-family: var(--mono); font-weight: 700; color: var(--ink); white-space: nowrap; }

    .reg-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .reg-row .name { font-weight: 700; color: var(--ink); }
    #register { display: flex; gap: 5px; }
    .cell {
      width: 34px; height: 38px; border-radius: 7px; border: 2px dashed var(--grid);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-weight: 700; font-size: 22px; color: var(--ink); background: #ffffff;
    }
    .cell.set { border-style: solid; border-color: var(--mu); }
    .cell.new1 { border: 3px solid var(--gr); background: var(--fg); color: var(--grt); }
    .cell.new0 { border: 3px solid var(--red); background: #fbeaea; color: var(--red); }
    .bits12 .cell { width: 25px; height: 32px; font-size: 18px; }
    .reg-ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--mu); margin-top: 2px; }

    #result {
      margin-top: 10px; padding: 8px 14px; border-radius: 12px;
      border: 3px solid var(--gr); background: var(--fg); color: var(--grt);
    }
    #result.wait { border: 2px dashed var(--grid); background: #ffffff; color: var(--mu); }
    #result .big { font-family: var(--mono); font-weight: 700; font-size: 28px; color: var(--ink); }
    #result p { margin: 3px 0 0; font-size: 16.5px; line-height: 1.3; }
    #result .v { font-family: var(--mono); font-weight: 700; white-space: nowrap; }

    @media (max-width: 1000px) {
      .main { grid-template-columns: 1fr; }
      .keys { display: none; }
      #vinSlider { width: 220px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>SAR ADC: one comparison for each bit</h1>
  <p class="lead">The ADC compares the input with a test voltage, keeps the half where the input is, and repeats.</p>

  <div class="controls">
    <div class="ctl">
      <span class="name">Input</span>
      <input id="vinSlider" type="range" min="0" max="330" step="1" value="240" aria-label="Input voltage" />
      <span id="vinValue">2.40 V</span>
    </div>
    <div class="ctl" role="group" aria-label="Number of bits">
      <span class="name">Bits</span>
      <button class="bitsBtn on" data-bits="4">4</button>
      <button class="bitsBtn" data-bits="8">8</button>
      <button class="bitsBtn" data-bits="12">12</button>
    </div>
    <div class="ctl">
      <button id="backBtn">&#9664; Back</button>
      <button id="stepBtn" class="primary">Step &#9654;</button>
      <button id="playBtn">Play</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div class="keys"><kbd>&rarr;</kbd> step &nbsp; <kbd>&larr;</kbd> back &nbsp; <kbd>R</kbd> reset</div>
  </div>

  <div class="main">
    <div class="card">
      <h2>All steps on one voltage scale</h2>
      <svg id="plot" viewBox="0 0 1000 580" role="img" aria-label="The range that is left after each step, on a scale from 0 to 3.3 volts"></svg>
    </div>
    <div class="card">
      <h2>This step, enlarged</h2>
      <div id="stepTitle"></div>
      <svg id="zoom" viewBox="0 0 520 262" role="img" aria-label="The range before this step, the test voltage in its middle, and the input"></svg>
      <p id="stepText"></p>
      <div class="reg-row">
        <span class="name">Register</span>
        <div>
          <div id="register"></div>
          <div class="reg-ends"><span id="regMsb"></span><span>bit 0</span></div>
        </div>
      </div>
      <div id="result" class="wait"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var VREF = 3.3, SVGNS = "http://www.w3.org/2000/svg";
  var C = { ink: "#174f73", mid: "#2b789f", or: "#d47b28", ort: "#b8621a", gr: "#3f7f58", grt: "#2b5a3e",
            red: "#a32d2d", mu: "#5a6b76", grid: "#c8d8e2", kept: "#d3e6f0", fb: "#e8f2f7" };

  var bits = 4, vin = 2.40, done = 0, timer = null;      // done = number of finished steps

  var $ = function (id) { return document.getElementById(id); };
  var plot = $("plot"), zoom = $("zoom");

  // Volts with d decimals, halves rounded up (2.475 -> 2.48, as on the slide).
  function fmt(v, d) {
    var m = Math.pow(10, d);
    return (Math.round(v * m + 1e-7) / m).toFixed(d);
  }
  function decimals() { return bits === 4 ? 2 : (bits === 8 ? 3 : 4); }
  function volts(v) { return fmt(v, decimals()) + " V"; }

  function compute() {
    var steps = [], lo = 0, hi = VREF, code = 0;
    for (var i = 0; i < bits; i++) {
      var lo0 = lo, hi0 = hi, test = (lo + hi) / 2, bit = vin >= test ? 1 : 0;
      if (bit) { lo = test; } else { hi = test; }
      code = code * 2 + bit;
      steps.push({ n: i + 1, bitIndex: bits - 1 - i, lo0: lo0, hi0: hi0, test: test, bit: bit, lo: lo, hi: hi, code: code });
    }
    return steps;
  }

  function el(parent, name, attrs, text) {
    var e = document.createElementNS(SVGNS, name);
    for (var k in attrs) { e.setAttribute(k, attrs[k]); }
    if (text !== undefined) { e.textContent = text; }
    parent.appendChild(e);
    return e;
  }
  function clear(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }

  // ---- left: every step on the same 0 to 3.3 V scale ---------------------
  function drawPlot(steps) {
    clear(plot);
    var L = 150, R = 935, T = 44, B = 452, H = B - T;
    var slot = (R - L) / bits, gap = bits === 4 ? 26 : (bits === 8 ? 12 : 8), w = slot - gap;
    var y = function (v) { return B - v / VREF * H; };

    el(plot, "text", { x: R + 10, y: T + 6, "font-size": 17, "font-weight": 700, fill: C.mu }, "3.3 V");
    el(plot, "text", { x: R + 10, y: B + 6, "font-size": 17, "font-weight": 700, fill: C.mu }, "0 V");
    el(plot, "line", { x1: L, y1: T, x2: R, y2: T, stroke: C.grid, "stroke-width": 2, "stroke-dasharray": "4 7" });
    el(plot, "line", { x1: L, y1: B, x2: R, y2: B, stroke: C.ink, "stroke-width": 2 });
    el(plot, "text", { x: L - 12, y: B + 36, "text-anchor": "end", "font-size": 16, "font-weight": 700, fill: C.mu }, "test");
    el(plot, "text", { x: L - 12, y: B + 64, "text-anchor": "end", "font-size": 16, "font-weight": 700, fill: C.mu }, "input is");
    el(plot, "text", { x: L - 12, y: B + 100, "text-anchor": "end", "font-size": 16, "font-weight": 700, fill: C.mu }, "bit");

    steps.forEach(function (s, i) {
      var x = L + i * slot + gap / 2, cx = x + w / 2, isDone = i < done, isNow = i === done - 1;
      el(plot, "text", { x: cx, y: T - 16, "text-anchor": "middle", "font-size": 17, "font-weight": 700,
                         fill: isDone ? C.mid : C.grid }, bits === 4 ? "step " + s.n : String(s.n));
      if (!isDone) { return; }
      var yTop0 = y(s.hi0), h0 = Math.max(y(s.lo0) - yTop0, 2), yTop = y(s.hi), h = Math.max(y(s.lo) - yTop, 2);
      el(plot, "rect", { x: x, y: yTop0, width: w, height: h0, fill: "#ffffff", stroke: C.mu,
                         "stroke-width": 1.5, "stroke-dasharray": "6 6" });
      el(plot, "rect", { x: x, y: yTop, width: w, height: h, fill: C.kept });
      if (bits === 4) {                      // one stripe for each code that is still possible
        var left = Math.round((s.hi - s.lo) / VREF * 16);
        for (var c = 1; c < left; c++) {
          el(plot, "line", { x1: x, y1: y(s.lo) - c * H / 16, x2: x + w, y2: y(s.lo) - c * H / 16, stroke: "#9dbfd1", "stroke-width": 1.5 });
        }
      }
      el(plot, "line", { x1: x, y1: y(s.test), x2: x + w, y2: y(s.test), stroke: C.or, "stroke-width": 4, "stroke-linecap": "round" });
      if (isNow) {
        el(plot, "rect", { x: x - 4, y: T - 4, width: w + 8, height: H + 8, fill: "none", stroke: C.ink, "stroke-width": 2, rx: 6 });
      }
      var col = s.bit ? C.grt : C.red;
      el(plot, "text", { x: cx, y: B + 36, "text-anchor": "middle", "font-size": bits === 12 ? 15 : 18, "font-weight": 700,
                         fill: C.ort, "class": "m" }, fmt(s.test, decimals()));
      el(plot, "text", { x: cx, y: B + 64, "text-anchor": "middle", "font-size": bits === 12 ? 15 : 17, "font-weight": 700,
                         fill: col }, s.bit ? "higher" : "lower");
      el(plot, "rect", { x: cx - 15, y: B + 78, width: 30, height: 32, rx: 6, fill: s.bit ? "#edf6f0" : "#fbeaea",
                         stroke: col, "stroke-width": isNow ? 3 : 2 });
      el(plot, "text", { x: cx, y: B + 102, "text-anchor": "middle", "font-size": 22, "font-weight": 700, fill: col, "class": "m" }, String(s.bit));
    });

    // the input, drawn last so it stays on top of every range
    var yi = y(vin);
    el(plot, "line", { x1: L - 14, y1: yi, x2: R, y2: yi, stroke: C.ink, "stroke-width": 3.5, "stroke-dasharray": "14 9" });
    el(plot, "text", { x: L - 24, y: yi - 6, "text-anchor": "end", "font-size": 17, "font-weight": 700, fill: C.ink }, "input");
    el(plot, "text", { x: L - 24, y: yi + 17, "text-anchor": "end", "font-size": 20, "font-weight": 700, fill: C.ink, "class": "m" },
       fmt(vin, 2) + " V");
  }

  // ---- right: the range of one step, always the same height --------------
  function drawZoom(steps) {
    clear(zoom);
    var pending = done === 0, s = steps[Math.max(done, 1) - 1];
    var X0 = 200, X1 = 330, T = 16, B = 246, H = B - T, mid = (T + B) / 2;

    if (!pending) {
      el(zoom, "rect", { x: X0, y: s.bit ? T : mid, width: X1 - X0, height: H / 2, fill: C.kept });
      el(zoom, "rect", { x: X0, y: s.bit ? mid : T, width: X1 - X0, height: H / 2, fill: "#f3f5f7" });
      el(zoom, "text", { x: (X0 + X1) / 2, y: (s.bit ? T : mid) + H / 4 + 6, "text-anchor": "middle", "font-size": 18,
                         "font-weight": 700, fill: C.mid }, "kept");
      el(zoom, "text", { x: (X0 + X1) / 2, y: (s.bit ? mid : T) + H / 4 + 6, "text-anchor": "middle", "font-size": 16,
                         "font-weight": 600, fill: C.mu }, "dropped");
    }
    el(zoom, "rect", { x: X0, y: T, width: X1 - X0, height: H, fill: "none", stroke: C.mu, "stroke-width": 2, "stroke-dasharray": "6 6" });
    el(zoom, "text", { x: X1 + 14, y: T + 6, "font-size": 18, "font-weight": 700, fill: C.mu, "class": "m" }, volts(s.hi0));
    el(zoom, "text", { x: X1 + 14, y: B + 6, "font-size": 18, "font-weight": 700, fill: C.mu, "class": "m" }, volts(s.lo0));
    el(zoom, "line", { x1: X0 - 8, y1: mid, x2: X1 + 8, y2: mid, stroke: C.or, "stroke-width": 5, "stroke-linecap": "round" });
    el(zoom, "text", { x: X1 + 14, y: mid - 7, "font-size": 16, "font-weight": 700, fill: C.ort }, "test");
    el(zoom, "text", { x: X1 + 14, y: mid + 18, "font-size": 21, "font-weight": 700, fill: C.ort, "class": "m" }, volts(s.test));

    var f = (vin - s.lo0) / (s.hi0 - s.lo0);
    var yi = B - Math.min(1, Math.max(0, f)) * H, below = yi < T + 44;
    el(zoom, "line", { x1: 30, y1: yi, x2: X1, y2: yi, stroke: C.ink, "stroke-width": 3.5, "stroke-dasharray": "12 8" });
    el(zoom, "text", { x: 30, y: below ? yi + 22 : yi - 31, "font-size": 16, "font-weight": 700, fill: C.ink }, "input");
    el(zoom, "text", { x: 30, y: below ? yi + 45 : yi - 9, "font-size": 21, "font-weight": 700, fill: C.ink, "class": "m" },
       fmt(vin, bits === 4 ? 2 : 3) + " V");
  }

  function drawText(steps) {
    var pending = done === 0, s = steps[Math.max(done, 1) - 1], v = function (x) { return '<span class="v">' + volts(x) + "</span>"; };
    $("stepTitle").textContent = pending ? "Next: step 1 of " + bits : "Step " + s.n + " of " + bits;
    if (pending) {
      $("stepText").innerHTML = "The input is somewhere between " + v(s.lo0) + " and " + v(s.hi0) +
        ". Step 1 tests the middle: " + v(s.test) + ".";
    } else {
      $("stepText").innerHTML = "The input is <b class=\"" + (s.bit ? "hi\">higher" : "lo\">lower") + "</b> than " + v(s.test) +
        ", so bit " + s.bitIndex + " = <b class=\"" + (s.bit ? "hi" : "lo") + "\">" + s.bit + "</b>. The " +
        (s.bit ? "upper" : "lower") + " half is kept: " + v(s.lo) + " to " + v(s.hi) + ".";
    }

    var reg = $("register");
    reg.innerHTML = "";
    reg.parentNode.parentNode.classList.toggle("bits12", bits === 12);
    steps.forEach(function (st, i) {
      var c = document.createElement("div");
      c.className = "cell" + (i < done ? (i === done - 1 ? (st.bit ? " new1" : " new0") : " set") : "");
      c.textContent = i < done ? String(st.bit) : "";
      reg.appendChild(c);
    });
    $("regMsb").textContent = "bit " + (bits - 1);

    var res = $("result"), last = steps[bits - 1], top = Math.pow(2, bits) - 1;
    if (done < bits) {
      res.className = "wait";
      res.innerHTML = "<p>" + (bits - done) + (bits - done === 1 ? " bit" : " bits") + " still to find. One step = " +
        '<span class="v">' + fmt(VREF / Math.pow(2, bits) * 1000, bits === 12 ? 1 : 0) + " mV</span>.</p>";
    } else {
      var bin = last.code.toString(2);
      while (bin.length < bits) { bin = "0" + bin; }
      res.className = "";
      res.innerHTML = "Result <span class=\"big\">" + bin + "</span> = <span class=\"v\">" + last.code + " of " + top + "</span>" +
        "<p>The input is between " + v(last.lo) + " and " + v(last.hi) + ": one step. That is all a " + bits + "-bit ADC can say.</p>" +
        "<p>Lecture formula: <span class=\"v\">" + last.code + " &times; 3300 &divide; " + top + " = " +
        Math.floor(last.code * 3300 / top) + " mV</span></p>";
    }
  }

  function render() {
    var steps = compute();
    drawPlot(steps); drawZoom(steps); drawText(steps);
    $("vinValue").textContent = fmt(vin, 2) + " V";
    $("backBtn").disabled = done === 0;
    $("stepBtn").disabled = done === bits;
    $("playBtn").textContent = timer ? "Pause" : "Play";
  }

  function stop() { if (timer) { clearInterval(timer); timer = null; } }
  function step() { if (done < bits) { done++; } if (done === bits) { stop(); } render(); }
  function back() { stop(); if (done > 0) { done--; } render(); }
  function reset() { stop(); done = 0; render(); }
  function play() {
    if (timer) { stop(); render(); return; }
    if (done === bits) { done = 0; }
    timer = setInterval(step, bits === 4 ? 1100 : 650);
    render();
  }

  $("vinSlider").addEventListener("input", function () { vin = Number(this.value) / 100; render(); });
  $("stepBtn").addEventListener("click", function () { stop(); step(); });
  $("backBtn").addEventListener("click", back);
  $("resetBtn").addEventListener("click", reset);
  $("playBtn").addEventListener("click", play);
  Array.prototype.forEach.call(document.querySelectorAll(".bitsBtn"), function (b) {
    b.addEventListener("click", function () {
      stop(); bits = Number(b.getAttribute("data-bits")); done = 0;
      Array.prototype.forEach.call(document.querySelectorAll(".bitsBtn"), function (o) { o.classList.toggle("on", o === b); });
      render();
    });
  });
  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.id === "vinSlider") { return; }       // the arrow keys move the slider there
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); stop(); step(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); back(); }
    else if (e.key === "r" || e.key === "R") { reset(); }
  });

  // A link can open the demo in a given state: sac.html?bits=12&vin=2.4&step=5
  (function () {
    var q = new URLSearchParams(location.search), b = Number(q.get("bits")), v = Number(q.get("vin")), st = Number(q.get("step"));
    if (b === 4 || b === 8 || b === 12) {
      bits = b;
      Array.prototype.forEach.call(document.querySelectorAll(".bitsBtn"), function (o) { o.classList.toggle("on", Number(o.getAttribute("data-bits")) === b); });
    }
    if (q.get("vin") !== null && v >= 0 && v <= VREF) { vin = Math.round(v * 100) / 100; $("vinSlider").value = String(Math.round(vin * 100)); }
    if (st > 0) { done = Math.min(bits, Math.floor(st)); }
  })();

  render();
})();
</script>
</body>
</html>
