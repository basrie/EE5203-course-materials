<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Four steps: 1 paper, trace the B code, 20 minutes; 2 laptop, new project, 30 minutes; 3 board, Checkpoints B, C, D, 60 minutes; 4 video, 2 to 4 minutes; then submit on CATS by Monday 12 October 23:55">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5968"/></marker>
  </defs>
  <rect width="900" height="260" fill="#ffffff"/>
  <rect x="5" y="10" width="200" height="170" rx="14" fill="#e8f1fb" stroke="#2f6db5" stroke-width="3"/>
  <text x="105" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#1d4f8a">1 Paper</text>
  <text x="105" y="95" text-anchor="middle" font-size="21" fill="#202b38">trace the</text>
  <text x="105" y="122" text-anchor="middle" font-size="21" fill="#202b38">B code</text>
  <text x="105" y="163" text-anchor="middle" font-size="21" font-weight="700" fill="#2f6db5">20 min</text>
  <line x1="207" y1="95" x2="229" y2="95" stroke="#4a5968" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="233" y="10" width="200" height="170" rx="14" fill="#eef7ee" stroke="#2e7d32" stroke-width="3"/>
  <text x="333" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#1b5e20">2 Laptop</text>
  <text x="333" y="95" text-anchor="middle" font-size="21" fill="#202b38">new project,</text>
  <text x="333" y="122" text-anchor="middle" font-size="21" fill="#202b38">build with F7</text>
  <text x="333" y="163" text-anchor="middle" font-size="21" font-weight="700" fill="#2e7d32">30 min</text>
  <line x1="435" y1="95" x2="457" y2="95" stroke="#4a5968" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="461" y="10" width="200" height="170" rx="14" fill="#fff4e5" stroke="#e8a317" stroke-width="3"/>
  <text x="561" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#8a5200">3 Board</text>
  <text x="561" y="95" text-anchor="middle" font-size="21" fill="#202b38">Checkpoints</text>
  <text x="561" y="122" text-anchor="middle" font-size="21" fill="#202b38">B, C, D</text>
  <text x="561" y="163" text-anchor="middle" font-size="21" font-weight="700" fill="#b06d00">60 min</text>
  <line x1="663" y1="95" x2="685" y2="95" stroke="#4a5968" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="689" y="10" width="206" height="170" rx="14" fill="#f3ecfb" stroke="#7b3fb5" stroke-width="3"/>
  <text x="792" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#4a1d8a">4 Video</text>
  <text x="792" y="95" text-anchor="middle" font-size="21" fill="#202b38">show and</text>
  <text x="792" y="122" text-anchor="middle" font-size="21" fill="#202b38">explain</text>
  <text x="792" y="163" text-anchor="middle" font-size="21" font-weight="700" fill="#7b3fb5">2-4 min</text>
  <rect x="5" y="198" width="890" height="52" rx="10" fill="#f4f6f8" stroke="#9aa7b4" stroke-width="2"/>
  <text x="450" y="232" text-anchor="middle" font-size="22" fill="#202b38">Submit on <tspan font-weight="700">CATS</tspan> by <tspan font-weight="700">Monday 12 October, 23:55</tspan></text>
</svg>
