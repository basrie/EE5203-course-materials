<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="The array values: 1200, 4095, 300, 2600 at i equals 0 to 3. Each loop step adds values[i] to sum. The first sum box shows 1200; the other three are question marks for you to fill.">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
  </defs>
  <rect width="900" height="250" fill="#ffffff"/>
  <text x="10" y="55" font-size="24" font-weight="700" fill="#202b38" font-family="Consolas, Menlo, monospace">values</text>
  <g font-size="32" font-weight="700" text-anchor="middle" fill="#1d4f8a">
    <rect x="130" y="15" width="190" height="62" fill="#e8f1fb" stroke="#2f6db5" stroke-width="3"/><text x="225" y="58">1200</text>
    <rect x="320" y="15" width="190" height="62" fill="#e8f1fb" stroke="#2f6db5" stroke-width="3"/><text x="415" y="58">4095</text>
    <rect x="510" y="15" width="190" height="62" fill="#e8f1fb" stroke="#2f6db5" stroke-width="3"/><text x="605" y="58">300</text>
    <rect x="700" y="15" width="190" height="62" fill="#e8f1fb" stroke="#2f6db5" stroke-width="3"/><text x="795" y="58">2600</text>
  </g>
  <g font-size="22" text-anchor="middle" fill="#4a5968" font-family="Consolas, Menlo, monospace">
    <text x="170" y="108">i = 0</text><text x="360" y="108">i = 1</text><text x="550" y="108">i = 2</text><text x="740" y="108">i = 3</text>
  </g>
  <g stroke="#2e7d32" stroke-width="4">
    <line x1="225" y1="80" x2="225" y2="152" marker-end="url(#ar2)"/><line x1="415" y1="80" x2="415" y2="152" marker-end="url(#ar2)"/>
    <line x1="605" y1="80" x2="605" y2="152" marker-end="url(#ar2)"/><line x1="795" y1="80" x2="795" y2="152" marker-end="url(#ar2)"/>
  </g>
  <g font-size="26" font-weight="700" fill="#2e7d32"><text x="236" y="140">+</text><text x="426" y="140">+</text><text x="616" y="140">+</text><text x="806" y="140">+</text></g>
  <text x="10" y="200" font-size="24" font-weight="700" fill="#202b38" font-family="Consolas, Menlo, monospace">sum</text>
  <rect x="155" y="160" width="140" height="62" rx="10" fill="#eef7ee" stroke="#2e7d32" stroke-width="3"/>
  <rect x="345" y="160" width="140" height="62" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="3" stroke-dasharray="8 5"/>
  <rect x="535" y="160" width="140" height="62" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="3" stroke-dasharray="8 5"/>
  <rect x="725" y="160" width="140" height="62" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="3" stroke-dasharray="8 5"/>
  <g stroke="#2e7d32" stroke-width="4"><line x1="298" y1="191" x2="338" y2="191" marker-end="url(#ar2)"/><line x1="488" y1="191" x2="528" y2="191" marker-end="url(#ar2)"/><line x1="678" y1="191" x2="718" y2="191" marker-end="url(#ar2)"/></g>
  <g font-size="32" font-weight="700" text-anchor="middle"><text x="225" y="203" fill="#1b5e20">1200</text><text x="415" y="203" fill="#9aa7b4">?</text><text x="605" y="203" fill="#9aa7b4">?</text><text x="795" y="203" fill="#9aa7b4">?</text></g>
</svg>
