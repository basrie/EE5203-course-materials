<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Schematic of VS Code while stepping through led_init. 1: the STM32CUBE REGISTERS TREE section in Run and Debug. 2: RCC AHB1ENR with the field GPIOAEN equal to 1. 3: GPIOA MODER with the field MODER5 still 0. The hex values of the whole registers contain other bits. 4: Step Over F10 and Step Into F11.">
  <rect width="900" height="420" fill="#ffffff"/>
  <rect x="20" y="15" width="860" height="360" rx="8" fill="#1e1e1e" stroke="#555"/>
  <rect x="20" y="15" width="860" height="30" rx="8" fill="#323233"/>
  <!-- debug toolbar -->
  <rect x="560" y="52" width="200" height="30" rx="4" fill="#333333" stroke="#e8a317" stroke-width="2"/>
  <text x="575" y="72" font-size="14" fill="#89d185">▶</text><text x="603" y="72" font-size="14" fill="#cccccc">⏸</text>
  <text x="631" y="72" font-size="15" fill="#75beff">↷</text><text x="659" y="72" font-size="15" fill="#75beff">↓</text>
  <text x="687" y="72" font-size="15" fill="#75beff">↑</text><text x="715" y="72" font-size="14" fill="#f48771">■</text>
  <text x="580" y="104" font-size="15" font-weight="700" fill="#e8a317">F10 over · F11 into</text>
  <circle cx="780" cy="67" r="13" fill="#e8a317"/><text x="780" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
  <!-- left panel -->
  <rect x="20" y="45" width="370" height="330" fill="#252526"/>
  <text x="36" y="70" font-size="14" font-weight="700" fill="#bbbbbb">RUN AND DEBUG</text>
  <text x="36" y="96" font-size="14" fill="#bbbbbb">▸ VARIABLES</text>
  <text x="36" y="120" font-size="14" fill="#bbbbbb">▸ WATCH</text>
  <rect x="28" y="132" width="354" height="196" rx="4" fill="#2d2d30" stroke="#e8a317" stroke-width="3"/>
  <text x="36" y="154" font-size="14" font-weight="700" fill="#ffffff">▾ STM32CUBE REGISTERS TREE</text>
  <circle cx="20" cy="150" r="13" fill="#e8a317"/><text x="20" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <g font-size="15" font-family="Consolas, Menlo, monospace">
    <text x="44" y="182" fill="#cccccc">▾ RCC</text>
    <text x="64" y="206" fill="#9cdcfe">▾ AHB1ENR</text><text x="250" y="206" fill="#b5cea8">0x00100001</text>
    <rect x="80" y="214" width="290" height="22" rx="3" fill="#094771"/>
    <text x="84" y="230" fill="#ffffff">GPIOAEN [0]</text><text x="322" y="230" fill="#ffffff" font-weight="700">1</text>
    <text x="44" y="262" fill="#cccccc">▾ GPIOA</text>
    <text x="64" y="286" fill="#9cdcfe">▾ MODER</text><text x="250" y="286" fill="#b5cea8">0xA8000000</text>
    <rect x="80" y="294" width="290" height="22" rx="3" fill="#3a3d41"/>
    <text x="84" y="310" fill="#ffffff">MODER5 [11:10]</text><text x="322" y="310" fill="#ffffff" font-weight="700">0</text>
  </g>
  <circle cx="384" cy="225" r="12" fill="#e8a317"/><text x="384" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
  <circle cx="384" cy="305" r="12" fill="#e8a317"/><text x="384" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
  <!-- editor -->
  <g font-size="15" font-family="Consolas, Menlo, monospace">
    <text x="410" y="140" fill="#c586c0">void <tspan fill="#dcdcaa">led_init</tspan><tspan fill="#d4d4d4">(void)</tspan></text>
    <text x="410" y="164" fill="#d4d4d4">{</text>
    <text x="430" y="190" fill="#6a9955">/* 1. GPIOA clock on */</text>
    <text x="430" y="214" fill="#6a9955">... your line ...</text>
    <rect x="402" y="226" width="472" height="24" fill="#4b4b18"/>
    <text x="408" y="244" fill="#ffcc00">➜</text>
    <text x="430" y="244" fill="#6a9955">/* 2. clear bits 11:10 */</text>
    <text x="430" y="272" fill="#6a9955">/* 3. write 01 into 11:10 */</text>
    <text x="410" y="298" fill="#d4d4d4">}</text>
  </g>
  <rect x="20" y="345" width="860" height="30" fill="#cc6633"/>
  <text x="40" y="365" font-size="14" fill="#ffffff">debugging: STM32Cube ST-Link   ·   paused in led_init()</text>
  <text x="450" y="405" text-anchor="middle" font-size="16" fill="#4a5968">Sketch. The clock line has run: GPIOAEN = 1. MODER5 is still 0. Read the fields, not the hex.</text>
</svg>
