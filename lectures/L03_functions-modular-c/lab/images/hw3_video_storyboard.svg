<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Video storyboard in six shots: 1 your student number on paper, about 10 seconds; 2 your files in VS Code and the successful build, 30 seconds; 3 Checkpoint B at a breakpoint in average_samples, press F5 twice, 40 seconds; 4 Checkpoint C stepping led_init with the Registers Tree, 40 seconds; 5 Checkpoint D, LD2 blinking with your delay, 30 seconds; 6 your oral question, 40 seconds">
  <rect width="900" height="420" fill="#ffffff"/>
  <!-- frame template: 280 x 175 -->
  <!-- 1 -->
  <rect x="10" y="10" width="280" height="190" rx="10" fill="#e8f1fb" stroke="#2f6db5" stroke-width="2"/>
  <circle cx="34" cy="34" r="15" fill="#2f6db5"/><text x="34" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
  <text x="58" y="40" font-size="22" font-weight="700" fill="#1d4f8a">Your number</text>
  <rect x="80" y="62" width="140" height="96" rx="4" fill="#ffffff" stroke="#9aa7b4" transform="rotate(-4 150 110)"/>
  <text x="150" y="98" text-anchor="middle" font-size="14" fill="#202b38" transform="rotate(-4 150 110)">Student number</text>
  <text x="150" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#202b38" font-family="Consolas, Menlo, monospace" transform="rotate(-4 150 110)">25xxxxxxxx</text>
  <text x="150" y="188" text-anchor="middle" font-size="18" fill="#4a5968">number only · 10 s</text>
  <!-- 2 -->
  <rect x="310" y="10" width="280" height="190" rx="10" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="334" cy="34" r="15" fill="#2e7d32"/><text x="334" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
  <text x="358" y="40" font-size="22" font-weight="700" fill="#1b5e20">Your files</text>
  <rect x="340" y="54" width="220" height="114" rx="4" fill="#252526"/>
  <text x="352" y="72" font-size="14" font-family="Consolas, Menlo, monospace" fill="#cccccc">sensor_math.h / .c</text>
  <text x="352" y="90" font-size="14" font-family="Consolas, Menlo, monospace" fill="#cccccc">led_reg.h / .c</text>
  <text x="352" y="108" font-size="14" font-family="Consolas, Menlo, monospace" fill="#cccccc">main.c</text>
  <rect x="346" y="114" width="208" height="22" rx="3" fill="#094771"/>
  <text x="352" y="130" font-size="14" font-family="Consolas, Menlo, monospace" fill="#ffffff">CMakeLists.txt (2 lines)</text>
  <text x="352" y="157" font-size="13" font-family="Consolas, Menlo, monospace" fill="#89d185">✓ exit code 0</text>
  <text x="450" y="188" text-anchor="middle" font-size="18" fill="#4a5968">files + build + led_on · 30 s</text>
  <!-- 3 -->
  <rect x="610" y="10" width="280" height="190" rx="10" fill="#fff4e5" stroke="#e8a317" stroke-width="2"/>
  <circle cx="634" cy="34" r="15" fill="#e8a317"/><text x="634" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
  <text x="658" y="40" font-size="22" font-weight="700" fill="#8a5200">Checkpoint B</text>
  <rect x="640" y="56" width="220" height="104" rx="4" fill="#1e1e1e"/>
  <circle cx="654" cy="80" r="5" fill="#e51400"/>
  <text x="666" y="84" font-size="14" font-family="Consolas, Menlo, monospace" fill="#d4d4d4">sum = sum + values[i];</text>
  <text x="654" y="116" font-size="15" font-family="Consolas, Menlo, monospace" fill="#9cdcfe">i: <tspan fill="#b5cea8" font-weight="700">1</tspan>   sum: <tspan fill="#b5cea8" font-weight="700">850</tspan></text>
  <text x="654" y="146" font-size="15" fill="#cccccc">press F5 twice</text>
  <text x="750" y="188" text-anchor="middle" font-size="18" fill="#4a5968">i and sum · 40 s</text>
  <!-- 4 -->
  <rect x="10" y="220" width="280" height="190" rx="10" fill="#fff4e5" stroke="#e8a317" stroke-width="2"/>
  <circle cx="34" cy="244" r="15" fill="#e8a317"/><text x="34" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
  <text x="58" y="250" font-size="22" font-weight="700" fill="#8a5200">Checkpoint C</text>
  <rect x="40" y="266" width="220" height="104" rx="4" fill="#252526"/>
  <text x="52" y="288" font-size="12" font-weight="700" fill="#ffffff">▾ REGISTERS TREE</text>
  <text x="52" y="316" font-size="14" font-family="Consolas, Menlo, monospace" fill="#9cdcfe">GPIOAEN: <tspan fill="#b5cea8">0</tspan> → <tspan fill="#b5cea8" font-weight="700">1</tspan></text>
  <text x="52" y="342" font-size="14" font-family="Consolas, Menlo, monospace" fill="#9cdcfe">MODER5:  <tspan fill="#b5cea8">0</tspan> → <tspan fill="#b5cea8" font-weight="700">1</tspan></text>
  <text x="150" y="398" text-anchor="middle" font-size="18" fill="#4a5968">bits + clock first · 40 s</text>
  <!-- 5 -->
  <rect x="310" y="220" width="280" height="190" rx="10" fill="#fff4e5" stroke="#e8a317" stroke-width="2"/>
  <circle cx="334" cy="244" r="15" fill="#e8a317"/><text x="334" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">5</text>
  <text x="358" y="250" font-size="22" font-weight="700" fill="#8a5200">Checkpoint D</text>
  <rect x="370" y="268" width="160" height="100" rx="8" fill="#f4f6f8" stroke="#9aa7b4"/>
  <rect x="425" y="296" width="50" height="44" fill="#202b38"/>
  <circle cx="395" cy="318" r="14" fill="#7ee08a" opacity="0.45"/>
  <circle cx="395" cy="318" r="7" fill="#2e9d3a"/>
  <text x="395" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#2e7d32">LD2</text>
  <text x="500" y="362" text-anchor="middle" font-size="11" fill="#4a5968">your delay</text>
  <text x="450" y="398" text-anchor="middle" font-size="18" fill="#4a5968">blink + led_off() · 30 s</text>
  <!-- 6 -->
  <rect x="610" y="220" width="280" height="190" rx="10" fill="#f3ecfb" stroke="#7b3fb5" stroke-width="2"/>
  <circle cx="634" cy="244" r="15" fill="#7b3fb5"/><text x="634" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">6</text>
  <text x="658" y="250" font-size="22" font-weight="700" fill="#4a1d8a">Your question</text>
  <path d="M650 272 h180 a12 12 0 0 1 12 12 v52 a12 12 0 0 1 -12 12 h-120 l-22 18 l4 -18 h-42 a12 12 0 0 1 -12 -12 v-52 a12 12 0 0 1 12 -12 z" fill="#ffffff" stroke="#7b3fb5" stroke-width="2"/>
  <text x="740" y="304" text-anchor="middle" font-size="17" fill="#202b38">the question for</text>
  <text x="740" y="326" text-anchor="middle" font-size="17" font-weight="700" fill="#4a1d8a">your last digit</text>
  <text x="750" y="398" text-anchor="middle" font-size="18" fill="#4a5968">own words · 40 s</text>
</svg>
