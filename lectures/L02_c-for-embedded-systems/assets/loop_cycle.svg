<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 390" role="img" aria-labelledby="title desc" font-family="Quicksand,Arial,sans-serif">
  <title id="title">How the for loop repeats</title>
  <desc id="desc">Initialize i once. Test i less than eight. If true, use samples[i], increment i and return to the test. If false, continue after the loop.</desc>
  <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#326f90"/></marker></defs>
  <g fill="none" stroke="#326f90" stroke-width="3" marker-end="url(#loop-arrow)">
    <path d="M280 126H389"/>
    <path d="M680 126H769"/>
    <path d="M1060 126H1169"/>
    <path d="M1290 72V26H540V65"/>
    <path d="M540 186V297"/>
  </g>
  <text x="900" y="18" text-anchor="middle" font-size="25" fill="#326f90" font-weight="700">return to the test</text>
  <text x="725" y="111" text-anchor="middle" font-size="26" fill="#3f7f58" font-weight="700">true</text>
  <text x="565" y="253" font-size="26" fill="#95511d" font-weight="700">false</text>
  <g>
    <rect x="40" y="72" width="240" height="114" rx="12" fill="#eef2f5" stroke="#8194a0" stroke-width="2"/>
    <text x="160" y="112" text-anchor="middle" font-size="25" font-weight="700" fill="#526b79">START · once</text>
    <text x="160" y="157" text-anchor="middle" font-size="32" fill="#174f73" font-family="ui-monospace,Menlo,monospace">int i = 0</text>
    <rect x="400" y="72" width="280" height="114" rx="12" fill="#fff0dc" stroke="#d47b28" stroke-width="3"/>
    <text x="540" y="112" text-anchor="middle" font-size="25" font-weight="700" fill="#95511d">TEST · every time</text>
    <text x="540" y="157" text-anchor="middle" font-size="34" font-weight="700" fill="#95511d" font-family="ui-monospace,Menlo,monospace">i &lt; 8 ?</text>
    <rect x="780" y="72" width="280" height="114" rx="12" fill="#e8f2f7" stroke="#2b789f" stroke-width="2"/>
    <text x="920" y="112" text-anchor="middle" font-size="25" font-weight="700" fill="#174f73">BODY · one element</text>
    <text x="920" y="157" text-anchor="middle" font-size="32" fill="#174f73" font-family="ui-monospace,Menlo,monospace">samples[i]</text>
    <rect x="1180" y="72" width="220" height="114" rx="12" fill="#edf6f0" stroke="#3f7f58" stroke-width="2"/>
    <text x="1290" y="112" text-anchor="middle" font-size="25" font-weight="700" fill="#3f7f58">UPDATE</text>
    <text x="1290" y="157" text-anchor="middle" font-size="34" font-weight="700" fill="#3f7f58" font-family="ui-monospace,Menlo,monospace">i++</text>
    <rect x="400" y="307" width="280" height="64" rx="12" fill="#fff" stroke="#8194a0" stroke-width="2"/>
    <text x="540" y="348" text-anchor="middle" font-size="28" font-weight="700" fill="#526b79">after the loop</text>
    <text x="780" y="260" font-size="28" fill="#355262">The body sees i = 0, 1, …, 7.</text>
    <text x="780" y="305" font-size="28" fill="#355262">At i = 8, the test fails.</text>
  </g>
</svg>
