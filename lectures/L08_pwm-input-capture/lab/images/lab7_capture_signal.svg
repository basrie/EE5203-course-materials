<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img"><title>The PWM signal on PB6. Channel 1 captures every rising edge into CCR1; channel 2 captures every falling edge into CCR2. The period is the new CCR1 minus the last rising capture; the high time is CCR2 minus the last rising capture.</title>
<text x="10" y="95" text-anchor="start" fill="#174f73" font-size="18" font-weight="700" font-family="Helvetica, Arial, sans-serif">PB6</text>
<text x="10" y="117" text-anchor="start" fill="#5a6b76" font-size="13" font-weight="400" font-family="Helvetica, Arial, sans-serif">(from D13)</text>
<rect x="160" y="70" width="105" height="60" fill="#e8f2f7"/>
<rect x="460" y="70" width="105" height="60" fill="#e8f2f7"/>
<rect x="760" y="70" width="105" height="60" fill="#e8f2f7"/>
<path d="M120 130 H160 V70 H265 V130 H460 V70 H565 V130 H760 V70 H865 V130 H940" fill="none" stroke="#174f73" stroke-width="3" stroke-linejoin="round"/>
<path d="M160 64 l-7 -12 l14 0 z" fill="#d47b28"/>
<path d="M460 64 l-7 -12 l14 0 z" fill="#d47b28"/>
<path d="M760 64 l-7 -12 l14 0 z" fill="#d47b28"/>
<path d="M265 136 l-7 12 l14 0 z" fill="#3f7f58"/>
<path d="M565 136 l-7 12 l14 0 z" fill="#3f7f58"/>
<text x="160" y="40" text-anchor="middle" fill="#b8621a" font-size="15" font-weight="700" font-family="Helvetica, Arial, sans-serif">CH1, rising: CCR1</text>
<text x="460" y="40" text-anchor="middle" fill="#b8621a" font-size="15" font-weight="700" font-family="Helvetica, Arial, sans-serif">CH1, rising: CCR1</text>
<text x="265" y="162" text-anchor="middle" fill="#2b5a3e" font-size="15" font-weight="700" font-family="Helvetica, Arial, sans-serif">CH2, falling: CCR2</text>
<path d="M160 190 v8 H460 v-8" fill="none" stroke="#d47b28" stroke-width="2"/>
<text x="310" y="218" text-anchor="middle" fill="#b8621a" font-size="15" font-weight="700" font-family="Helvetica, Arial, sans-serif">period_us = new CCR1 − last</text>
<path d="M460 190 v8 H565 v-8" fill="none" stroke="#3f7f58" stroke-width="2"/>
<text x="542" y="240" text-anchor="start" fill="#2b5a3e" font-size="15" font-weight="700" font-family="Helvetica, Arial, sans-serif">high_us = CCR2 − last</text>
</svg>
