<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="The arrow is on the line led_init(); in main.c. F10 Step Over runs the whole function and stops on the next line in main.c. F11 Step Into goes inside led_init in led_reg.c and stops on its first line. Shift+F11 Step Out finishes led_init and goes back to main.c.">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b3fb5"/></marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <!-- main.c -->
  <text x="20" y="34" font-size="20" font-weight="700" fill="#202b38" font-family="Consolas, Menlo, monospace">main.c</text>
  <rect x="10" y="46" width="380" height="200" rx="10" fill="#1e1e1e"/>
  <g font-size="20" font-family="Consolas, Menlo, monospace">
    <text x="40" y="92" fill="#d4d4d4">HAL_Init();</text>
    <rect x="14" y="112" width="372" height="36" fill="#4b4b18"/>
    <text x="18" y="137" fill="#ffcc00">➜</text><text x="40" y="137" fill="#dcdcaa">led_init<tspan fill="#d4d4d4">();</tspan></text>
    <text x="40" y="190" fill="#dcdcaa">MX_GPIO_Init<tspan fill="#d4d4d4">();</tspan></text>
  </g>
  <!-- led_reg.c -->
  <text x="520" y="34" font-size="20" font-weight="700" fill="#202b38" font-family="Consolas, Menlo, monospace">led_reg.c</text>
  <rect x="510" y="46" width="380" height="200" rx="10" fill="#1e1e1e"/>
  <g font-size="20" font-family="Consolas, Menlo, monospace">
    <text x="530" y="86" fill="#c586c0">void <tspan fill="#dcdcaa">led_init</tspan><tspan fill="#d4d4d4">(void) {</tspan></text>
    <text x="555" y="128" fill="#d4d4d4">RCC-&gt;AHB1ENR |= ...;</text>
    <text x="555" y="166" fill="#d4d4d4">GPIOA-&gt;MODER ...;</text>
    <text x="530" y="222" fill="#d4d4d4">}</text>
  </g>
  <!-- arrows -->
  <path d="M190 146 C 240 152, 240 172, 205 180" fill="none" stroke="#2e7d32" stroke-width="5" marker-end="url(#g)"/>
  <path d="M265 124 C 380 70, 440 90, 545 120" fill="none" stroke="#2f6db5" stroke-width="5" marker-end="url(#b)"/>
  <path d="M520 210 C 430 235, 380 215, 300 192" fill="none" stroke="#7b3fb5" stroke-width="5" stroke-dasharray="10 6" marker-end="url(#p)"/>
  <!-- legend cards -->
  <rect x="10" y="270" width="285" height="120" rx="12" fill="#eef7ee" stroke="#2e7d32" stroke-width="3"/>
  <text x="152" y="306" text-anchor="middle" font-size="24" font-weight="700" fill="#1b5e20">F10  Step Over</text>
  <text x="152" y="340" text-anchor="middle" font-size="18" fill="#202b38">runs the whole function,</text>
  <text x="152" y="366" text-anchor="middle" font-size="18" fill="#202b38">stops on the next line</text>
  <rect x="307" y="270" width="285" height="120" rx="12" fill="#e8f1fb" stroke="#2f6db5" stroke-width="3"/>
  <text x="450" y="306" text-anchor="middle" font-size="24" font-weight="700" fill="#1d4f8a">F11  Step Into</text>
  <text x="450" y="340" text-anchor="middle" font-size="18" fill="#202b38">goes inside the function,</text>
  <text x="450" y="366" text-anchor="middle" font-size="18" fill="#202b38">stops on its first line</text>
  <rect x="604" y="270" width="286" height="120" rx="12" fill="#f3ecfb" stroke="#7b3fb5" stroke-width="3"/>
  <text x="747" y="306" text-anchor="middle" font-size="24" font-weight="700" fill="#4a1d8a">Shift+F11  Step Out</text>
  <text x="747" y="340" text-anchor="middle" font-size="18" fill="#202b38">finishes the function,</text>
  <text x="747" y="366" text-anchor="middle" font-size="18" fill="#202b38">goes back to the caller</text>
</svg>
