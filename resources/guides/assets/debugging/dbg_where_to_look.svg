<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Sketch of VS Code during debugging with seven numbered areas: 1 debug configuration, 2 VARIABLES, 3 WATCH, 4 register panel, 5 BREAKPOINTS, 6 the editor with the red breakpoint dot and the yellow line, 7 the debug toolbar.">
  <rect width="900" height="470" fill="#ffffff"/>
  <rect x="10" y="10" width="880" height="420" rx="8" fill="#1e1e1e" stroke="#555"/>
  <rect x="10" y="10" width="880" height="30" rx="8" fill="#323233"/>
  <!-- sidebar -->
  <rect x="10" y="40" width="340" height="360" fill="#252526"/>
  <g font-size="16" fill="#cccccc">
    <rect x="22" y="52" width="316" height="34" rx="4" fill="#3a3d41" stroke="#e8a317" stroke-width="2"/>
    <text x="34" y="75" fill="#89d185">▷</text><text x="56" y="75" fill="#ffffff">Debug (ST-LINK)   ⚙</text>
    <rect x="22" y="98" width="316" height="72" rx="4" fill="#2d2d30" stroke="#e8a317" stroke-width="2"/>
    <text x="34" y="120" font-weight="700" fill="#ffffff">▾ VARIABLES</text>
    <text x="52" y="152" font-family="Consolas, Menlo, monospace" fill="#9cdcfe">i: <tspan fill="#b5cea8">1</tspan>   sum: <tspan fill="#b5cea8">850</tspan></text>
    <rect x="22" y="180" width="316" height="62" rx="4" fill="#2d2d30" stroke="#e8a317" stroke-width="2"/>
    <text x="34" y="202" font-weight="700" fill="#ffffff">▾ WATCH</text>
    <text x="52" y="230" font-family="Consolas, Menlo, monospace" fill="#9cdcfe">average: <tspan fill="#b5cea8">2392</tspan></text>
    <rect x="22" y="252" width="316" height="86" rx="4" fill="#2d2d30" stroke="#e8a317" stroke-width="2"/>
    <text x="34" y="274" font-weight="700" fill="#ffffff">▾ XPERIPHERALS</text>
    <text x="52" y="300" font-family="Consolas, Menlo, monospace" fill="#cccccc">▸ GPIOA</text>
    <text x="52" y="324" font-family="Consolas, Menlo, monospace" fill="#cccccc">▸ RCC</text>
    <rect x="22" y="348" width="316" height="42" rx="4" fill="#2d2d30" stroke="#e8a317" stroke-width="2"/>
    <text x="34" y="375" font-weight="700" fill="#ffffff">▾ BREAKPOINTS</text>
  </g>
  <!-- badges sidebar -->
  <g font-size="16" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="338" cy="52" r="14" fill="#e8a317"/><text x="338" y="58">1</text>
    <circle cx="338" cy="98" r="14" fill="#e8a317"/><text x="338" y="104">2</text>
    <circle cx="338" cy="180" r="14" fill="#e8a317"/><text x="338" y="186">3</text>
    <circle cx="338" cy="252" r="14" fill="#e8a317"/><text x="338" y="258">4</text>
    <circle cx="338" cy="348" r="14" fill="#e8a317"/><text x="338" y="354">5</text>
  </g>
  <!-- toolbar -->
  <rect x="560" y="48" width="230" height="34" rx="4" fill="#333333" stroke="#e8a317" stroke-width="2"/>
  <g font-size="17"><text x="576" y="71" fill="#89d185">▶</text><text x="608" y="71" fill="#75beff">↷</text><text x="640" y="71" fill="#75beff">↓</text><text x="672" y="71" fill="#75beff">↑</text><text x="704" y="71" fill="#89d185">⟲</text><text x="740" y="71" fill="#f48771">■</text></g>
  <circle cx="808" cy="65" r="14" fill="#e8a317"/><text x="808" y="71" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">7</text>
  <!-- editor -->
  <g font-size="17" font-family="Consolas, Menlo, monospace">
    <text x="380" y="140" fill="#d4d4d4">uint32_t sum = 0;</text>
    <text x="380" y="176" fill="#c586c0">for <tspan fill="#d4d4d4">(int i = 0; i &lt; count; i++) {</tspan></text>
    <rect x="352" y="192" width="534" height="32" fill="#4b4b18"/>
    <circle cx="364" cy="208" r="7" fill="#e51400"/>
    <text x="378" y="214" fill="#ffcc00">➜</text><text x="404" y="214" fill="#d4d4d4">sum = sum + values[i];</text>
    <text x="380" y="252" fill="#d4d4d4">}</text>
    <text x="380" y="288" fill="#c586c0">return <tspan fill="#d4d4d4">sum / count;</tspan></text>
  </g>
  <circle cx="866" cy="208" r="14" fill="#e8a317"/><text x="866" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">6</text>
  <rect x="10" y="400" width="880" height="30" fill="#cc6633"/>
  <text x="30" y="420" font-size="15" fill="#ffffff">debugging  ·  paused at a breakpoint</text>
  <text x="450" y="458" text-anchor="middle" font-size="16" fill="#4a5968">Sketch of the lab PC. At home, 1 shows the STM32Cube configuration and 4 is STM32CUBE REGISTERS TREE.</text>
</svg>
