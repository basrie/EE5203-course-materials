<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 0 820 360" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Nucleo-F401RE board: plug the USB cable into the connector on the ST-LINK part at the top of the board; LD1 shows the ST-LINK state, LD2 is the user LED">
  <rect x="-120" width="820" height="360" fill="#ffffff"/>
  <!-- board -->
  <rect x="150" y="20" width="300" height="320" rx="10" fill="#f4f4f4" stroke="#6b7b8c" stroke-width="2"/>
  <!-- stlink part -->
  <rect x="150" y="20" width="300" height="95" rx="10" fill="#e6ecf2" stroke="#6b7b8c" stroke-width="2"/>
  <text x="300" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4f8a">ST-LINK (programmer/debugger)</text>
  <!-- usb connector -->
  <rect x="270" y="6" width="60" height="28" rx="3" fill="#b0b8c1" stroke="#e8a317" stroke-width="3"/>
  <text x="300" y="25" text-anchor="middle" font-size="11" font-weight="700" fill="#202b38">USB</text>
  <line x1="335" y1="20" x2="470" y2="20" stroke="#e8a317" stroke-width="2"/>
  <text x="475" y="17" font-size="12" font-weight="700" fill="#8a5200">plug in here</text>
  <text x="475" y="33" font-size="11" fill="#8a5200">(DATA cable, not charge-only)</text>
  <!-- LD1 -->
  <circle cx="190" cy="55" r="7" fill="#d9480f"/>
  <line x1="140" y1="55" x2="183" y2="55" stroke="#6b7b8c"/><text x="135" y="60" text-anchor="end" font-size="12" fill="#202b38">LD1  ST-LINK status</text>
  <!-- LD3 power -->
  <circle cx="410" cy="140" r="7" fill="#d9480f"/>
  <text x="460" y="145" font-size="12" fill="#202b38">LD3  power</text>
  <line x1="418" y1="140" x2="455" y2="140" stroke="#6b7b8c"/>
  <!-- mcu -->
  <rect x="245" y="170" width="110" height="110" fill="#2b2b2b"/>
  <text x="300" y="220" text-anchor="middle" font-size="12" fill="#ffffff">STM32</text>
  <text x="300" y="238" text-anchor="middle" font-size="12" fill="#ffffff">F401RE</text>
  <!-- LD2 -->
  <circle cx="200" cy="215" r="7" fill="#2f9e44"/>
  <text x="140" y="220" text-anchor="end" font-size="12" font-weight="700" fill="#1b5e20">LD2  user LED (PA5)</text>
  <line x1="145" y1="215" x2="192" y2="215" stroke="#2e7d32"/>
  <!-- buttons -->
  <circle cx="200" cy="300" r="9" fill="#1c7ed6"/><line x1="145" y1="300" x2="191" y2="300" stroke="#6b7b8c"/><text x="140" y="305" text-anchor="end" font-size="12" fill="#202b38">B1 USER (blue)</text>
  <circle cx="400" cy="300" r="9" fill="#222"/><text x="460" y="305" font-size="12" fill="#202b38">B2 RESET (black)</text>
  <line x1="410" y1="300" x2="455" y2="300" stroke="#6b7b8c"/>
</svg>
