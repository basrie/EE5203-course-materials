<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Toolchain overview: STM32CubeMX generates the project, VS Code with the STM32 extension builds it, the ST-LINK on the Nucleo board flashes and debugs it">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5968"/></marker>
  </defs>
  <rect width="900" height="250" fill="#ffffff"/>
  <!-- CubeMX -->
  <rect x="20" y="40" width="230" height="150" rx="12" fill="#e8f1fb" stroke="#2f6db5" stroke-width="2"/>
  <text x="135" y="72" text-anchor="middle" font-size="19" font-weight="700" fill="#1d4f8a">1  STM32CubeMX</text>
  <text x="135" y="102" text-anchor="middle" font-size="14" fill="#202b38">choose the board</text>
  <text x="135" y="124" text-anchor="middle" font-size="14" fill="#202b38">configure pins</text>
  <text x="135" y="146" text-anchor="middle" font-size="14" fill="#202b38">Generate Code (CMake)</text>
  <text x="135" y="176" text-anchor="middle" font-size="12" fill="#4a5968">installed separately</text>
  <!-- arrow -->
  <line x1="255" y1="115" x2="330" y2="115" stroke="#4a5968" stroke-width="3" marker-end="url(#ar)"/>
  <text x="292" y="104" text-anchor="middle" font-size="12" fill="#4a5968">project</text>
  <text x="292" y="136" text-anchor="middle" font-size="12" fill="#4a5968">folder</text>
  <!-- VS Code -->
  <rect x="335" y="20" width="270" height="190" rx="12" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="470" y="52" text-anchor="middle" font-size="19" font-weight="700" fill="#1b5e20">2  VS Code</text>
  <text x="470" y="80" text-anchor="middle" font-size="14" fill="#202b38">edit main.c</text>
  <text x="470" y="102" text-anchor="middle" font-size="14" fill="#202b38">build (F7)  ·  debug (Run and Debug)</text>
  <rect x="355" y="118" width="230" height="78" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-dasharray="5 4"/>
  <text x="470" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">STM32CubeIDE extension</text>
  <text x="470" y="161" text-anchor="middle" font-size="12" fill="#202b38">downloads by itself: compiler,</text>
  <text x="470" y="179" text-anchor="middle" font-size="12" fill="#202b38">CMake, Ninja, ST-LINK server</text>
  <!-- arrow -->
  <line x1="610" y1="115" x2="685" y2="115" stroke="#4a5968" stroke-width="3" marker-end="url(#ar)"/>
  <text x="647" y="104" text-anchor="middle" font-size="12" fill="#4a5968">USB</text>
  <text x="647" y="136" text-anchor="middle" font-size="12" fill="#4a5968">(data cable)</text>
  <!-- Board -->
  <rect x="690" y="40" width="190" height="150" rx="12" fill="#fff4e5" stroke="#c77700" stroke-width="2"/>
  <text x="785" y="72" text-anchor="middle" font-size="19" font-weight="700" fill="#8a5200">3  Nucleo-F401RE</text>
  <text x="785" y="102" text-anchor="middle" font-size="14" fill="#202b38">ST-LINK flashes</text>
  <text x="785" y="124" text-anchor="middle" font-size="14" fill="#202b38">and debugs the</text>
  <text x="785" y="146" text-anchor="middle" font-size="14" fill="#202b38">STM32F401RE</text>
  <text x="785" y="176" text-anchor="middle" font-size="12" fill="#4a5968">Windows: USB driver once</text>
  <text x="450" y="238" text-anchor="middle" font-size="13" fill="#4a5968">At home you do NOT need STM32CubeCLT — the extension replaces it.</text>
</svg>
